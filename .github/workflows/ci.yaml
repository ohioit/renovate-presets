---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: ${{ matrix.name }}
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            task: lint:format
            tools: node npm:oxfmt
          - name: Shellcheck
            task: lint:shell
            tools: aqua:koalaman/shellcheck
          - name: Actionlint
            task: lint:actionlint
            tools: aqua:rhysd/actionlint
          - name: Zizmor
            task: lint:zizmor
            tools: aqua:zizmorcore/zizmor
          - name: Validate Renovate presets
            task: validate
            tools: node npm:renovate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          experimental: true
          install_args: --locked ${{ matrix.tools }}

      - name: Run ${{ matrix.task }}
        env:
          # zizmor's online audits query the GitHub API
          GH_TOKEN: ${{ matrix.task == 'lint:zizmor' && github.token || '' }}
          TASK: ${{ matrix.task }}
        run: mise run "$TASK"

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - lint
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      # cancelled counts as failed: !cancelled() above still runs this job when
      # individual needs were cancelled but the run was not, and a required job
      # that never reached a verdict must not clear the merge gate.
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
